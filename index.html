<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oranżeria Falenty – waloryzacja</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #24211d; --muted: #6f6a62; --line: #e2ddd4;
    --accent: #2f5d8a; --hl: #fff1c2; --hl-strong: #ffe08a; --viewer: #e9e6e0;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 13px/1.4 var(--font); color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); }
  header .spacer { flex: 1; }
  button, select, input { font: inherit; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; color: var(--ink); }
  .btn:hover { border-color: #bdb6aa; background: #faf8f4; }
  .btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .seg { display: inline-flex; }
  .seg .btn { border-radius: 0; margin-left: -1px; }
  .seg .btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg .btn:last-child { border-radius: 0 6px 6px 0; }

  main { flex: 1; display: flex; min-height: 0; }
  #viewer { flex: 1; position: relative; min-width: 0; background: var(--viewer); }
  #viewer canvas { display: block; width: 100%; height: 100%; outline: none; }
  #legend { position: absolute; left: 12px; bottom: 12px; background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 280px; max-height: calc(100% - 64px); overflow: auto; }
  #legend h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  #legend h3 span { flex: 1; }
  #legend.collapsed h3 { margin: 0; }
  #legend.collapsed #legendBody { display: none; }
  #legend h4 { margin: 8px 0 4px; font-size: 11px; font-weight: 600; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; }
  #legend .mat { display: flex; align-items: center; gap: 8px; padding: 1px 4px; font-size: 12px; }
  .lgtoggle { border: 1px solid var(--line); background: #fff; border-radius: 4px; width: 22px; height: 20px; line-height: 16px; padding: 0; cursor: pointer; color: var(--muted); }
  #legend .item { display: flex; align-items: center; gap: 8px; padding: 2px 4px; border-radius: 4px; cursor: default; }
  #legend .item:hover, #legend .item.hl { background: var(--hl); }
  #legend .item .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.2); display: inline-block; }
  #viewtools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  #viewtools .btn { background: rgba(255,255,255,.94); }
  #tooltip { position: absolute; pointer-events: none; background: #fff; border: 1px solid #cfc8bb; border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.12); max-width: 340px; display: none; z-index: 5; }
  #tooltip .id { font-weight: 600; margin-bottom: 4px; }
  #tooltip .row { display: flex; gap: 6px; align-items: baseline; margin-top: 2px; }
  #tooltip .k { color: var(--muted); min-width: 108px; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }

  aside { width: clamp(440px, 42vw, 640px); display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; }
  .tablebar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tablebar input[type=search] { flex: 1; min-width: 140px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .tablebar .count { color: var(--muted); white-space: nowrap; }
  .dirty-info { flex-basis: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #fff4e0; border: 1px solid #f0c987; border-radius: 6px; padding: 5px 8px; color: #6b4a12; }
  .dirty-info[hidden] { display: none; }
  .dirty-info code { background: #fbe7c4; padding: 0 3px; border-radius: 3px; }
  .dirty-info .btn { margin-left: auto; padding: 2px 8px; }
  tbody td.c-st.dirty, tbody td.c-sz.dirty { box-shadow: inset 3px 0 0 #e8a33a; }
  tbody td .sz select { flex: 1; min-width: 0; }
  .tablewrap { flex: 1; overflow: auto; min-height: 0; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  thead th { position: sticky; top: 0; background: #f7f5f1; z-index: 1; text-align: left; font-weight: 600; padding: 7px 8px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  thead th .arrow { color: var(--muted); font-size: 10px; margin-left: 4px; }
  th.c-id { width: 25%; } th.c-sz { width: 23%; } th.c-st { width: 23%; } th.c-wt { width: 29%; }
  tbody td { padding: 5px 8px; border-bottom: 1px solid #efebe4; vertical-align: top; }
  tbody td.c-id { font-weight: 500; overflow-wrap: anywhere; }
  tbody td.c-id .auto { color: var(--muted); font-weight: 400; font-size: 11px; display: block; }
  tbody td .sz { display: flex; gap: 6px; align-items: center; }
  tbody td select { width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; background: #fff; }
  tbody td.c-wt .prio { display: inline-block; font-size: 10px; font-weight: 600; border-radius: 3px; padding: 0 4px; margin-right: 4px; color: #fff; vertical-align: 1px; }
  .p1 { background: #b3261e; } .p2 { background: #d9822b; } .p3 { background: #6c8f3a; } .p4 { background: #3d7a8a; } .p0 { background: #9a948b; }
  tbody tr.hl td { background: var(--hl); }
  tbody td.hlc { background: var(--hl-strong) !important; }
  tbody tr.pinned td { box-shadow: inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent); }
  tbody tr.pinned td:first-child { box-shadow: inset 3px 0 0 var(--accent), inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent); }

  dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; max-width: min(860px, 92vw); max-height: 86vh; }
  dialog .dh { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; }
  dialog .dh h2 { margin: 0; font-size: 15px; flex: 1; }
  dialog .db { padding: 12px 16px; }
  dialog table td, dialog table th { border-bottom: 1px solid #efebe4; padding: 4px 6px; text-align: left; vertical-align: top; }
  dialog ul { padding-left: 18px; }
  dialog code { background: #f3f0ea; padding: 0 3px; border-radius: 3px; }

  @media (max-width: 900px) {
    main { flex-direction: column; }
    #viewer { min-height: 55vh; }
    aside { width: 100%; max-width: none; border-left: 0; border-top: 1px solid var(--line); min-height: 45vh; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<header>
  <h1>Oranżeria w Falentach</h1>
  <span class="sub" id="srcinfo">waloryzacja – model 3D</span>
  <span class="spacer"></span>
  <span class="seg" id="colormode">
    <button class="btn on" data-mode="state" title="Kolory warstw stanu zachowania">Stan zachowania</button>
    <button class="btn" data-mode="tech" title="Kolory według stanu technicznego (ta sama skala barw)">Stan techniczny</button>
    <button class="btn" data-mode="material" title="Kolory warstw materiałowych (Oranzeria::*)">Materiał</button>
  </span>
  <button class="btn" id="btnRules">Reguły wytycznych</button>
  <button class="btn" id="btnNotes">Uwagi do modelu</button>
</header>
<main>
  <section id="viewer">
    <div id="loading">Wczytywanie modelu…</div>
    <div id="viewtools">
      <button class="btn" data-view="front" title="Elewacja NE (arkadowa)">Front</button>
      <button class="btn" data-view="back" title="Elewacja SW (tylna)">Tył</button>
      <button class="btn" data-view="persp">Perspektywa</button>
      <button class="btn" data-view="top">Z góry</button>
      <button class="btn" id="btnXray" title="Przy podświetlaniu z tabeli pozostałe elementy stają się półprzezroczyste">Prześwietlanie: wł.</button>
    </div>
    <div id="legend">
      <h3><span>Stan zachowania</span><button class="lgtoggle" id="legendToggle" title="Zwiń / rozwiń legendę">–</button></h3>
      <div id="legendBody">
        <div id="legendItems"></div>
        <div id="legendMat" hidden><h4>Materiały (kolory modelu)</h4><div id="legendMatItems"></div></div>
      </div>
    </div>
    <div id="tooltip"></div>
  </section>
  <aside>
    <div class="tablebar">
      <input type="search" id="filter" placeholder="Szukaj (ID, stan, wytyczne)…">
      <span class="count" id="count"></span>
      <button class="btn" id="btnExport" title="Pobierz nową wersję wspólnego pliku data/oceny.js">Zapisz plik</button>
      <button class="btn" id="btnImport" title="Wczytaj oceny z pliku (.js lub .json)">Import</button>
      <input type="file" id="importFile" accept=".js,.json,application/json,text/javascript" hidden>
      <span class="dirty-info" id="dirtyInfo" hidden>Niezapisane zmiany: <b>0</b> – kliknij „Zapisz plik” i podmień <code>data/oceny.js</code>.
        <button class="btn" id="btnDiscard">Odrzuć</button></span>
    </div>
    <div class="tablewrap">
      <table id="tbl">
        <thead><tr>
          <th class="c-id" data-col="id">ID elementu<span class="arrow"></span></th>
          <th class="c-sz" data-col="sz">Stan zachowania<span class="arrow"></span></th>
          <th class="c-st" data-col="st">Stan techniczny<span class="arrow"></span></th>
          <th class="c-wt" data-col="wt">Wytyczne<span class="arrow"></span></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </aside>
</main>

<dialog id="dlgRules"><div class="dh"><h2>Reguły wyznaczania wytycznych</h2><button class="btn" data-close>Zamknij</button></div><div class="db" id="rulesBody"></div></dialog>
<dialog id="dlgNotes"><div class="dh"><h2>Uwagi do modelu</h2><button class="btn" data-close>Zamknij</button></div><div class="db" id="notesBody"></div></dialog>

<!-- ?v= wymusza pobranie nowej wersji po aktualizacji; zmień numer przy zmianie tych plików -->
<script src="js/reguly-wytycznych.js?v=3"></script>
<script src="data/model-data.js?v=3"></script>
<script src="data/oceny.js?v=3"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const D = window.MODEL_DATA;
if (!D || !window.REGULY_WYTYCZNYCH) {
  document.getElementById('loading').textContent = 'Nie udało się wczytać danych (data/model-data.js lub js/reguly-wytycznych.js). Otwórz index.html z folderu projektu.';
  throw new Error('Brak danych modelu');
}
const RULES = window.REGULY_WYTYCZNYCH;
const STORE_KEY = 'falenty-oranzeria:oceny-zmiany';
const OLD_STORE_KEY = 'falenty-oranzeria:stan-techniczny-zmiany';

// ---------- dane ----------
const stateByKey = Object.fromEntries(D.states.map(s => [s.key, s]));
// stany do wyboru: oceny 1-10 i "Brak oceny" (bez warstw pomocniczych, np. "Opisy")
const STATE_CHOICES = D.states.filter(s => s.grade !== null || s.key === 'Brak oceny');
const cmpNat = (a, b) => a.localeCompare(b, 'pl', { numeric: true, sensitivity: 'base' });
const els = D.elements.map(e => ({ ...e, modelState: stateByKey[e.stateKey], state: stateByKey[e.stateKey] })).sort((a, b) => cmpNat(a.id, b.id));
els.forEach((e, i) => e.idx = i);
const byId = new Map(els.map(e => [e.id, e]));
document.getElementById('srcinfo').textContent = 'waloryzacja – model 3D (' + D.source + ')';

// oceny: wspolny plik data/oceny.js + niezapisane zmiany tej przegladarki.
// local.t: ID -> stan techniczny lub '' (wyczyszczony); local.z: ID -> klucz stanu zachowania.
// Wpis lokalny znika, gdy zgadza sie z plikiem.
const sharedFile = window.OCENY || {};
const shared = { t: sharedFile.stanTechniczny || {}, z: sharedFile.stanZachowania || {} };
for (const id of Object.keys(shared.z)) if (!stateByKey[shared.z[id]]) delete shared.z[id];
let local = { t: {}, z: {} };
try {
  const raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (raw) local = { t: raw.t || {}, z: raw.z || {} };
  else local.t = JSON.parse(localStorage.getItem(OLD_STORE_KEY) || '{}') || {};
  localStorage.removeItem(OLD_STORE_KEY);
} catch (_) {}
const sharedT = id => shared.t[id] || '';
const sharedZ = id => shared.z[id] || byId.get(id).modelState.key;
const validT = v => v === '' || /^([1-9]|10)$/.test(v); // '' = wyczyszczony; stare wartosci slowne odpadaja
for (const id of Object.keys(shared.t)) if (!validT(shared.t[id])) delete shared.t[id];
for (const id of Object.keys(local.t)) if (!byId.has(id) || !validT(local.t[id]) || local.t[id] === sharedT(id)) delete local.t[id];
for (const id of Object.keys(local.z)) if (!byId.has(id) || !stateByKey[local.z[id]] || local.z[id] === sharedZ(id)) delete local.z[id];
const saveLocal = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(local)); } catch (_) {} };
saveLocal();
const techOf = e => { const v = e.id in local.t ? local.t[e.id] : shared.t[e.id]; return TECH_LABEL[v] ? v : null; };
const zKeyOf = e => e.id in local.z ? local.z[e.id] : sharedZ(e.id);
const dirtyCount = () => Object.keys(local.t).length + Object.keys(local.z).length;
function setTech(id, v) { if (v === sharedT(id)) delete local.t[id]; else local.t[id] = v; syncTech(byId.get(id)); }
function setZach(id, key) { if (key === sharedZ(id)) delete local.z[id]; else local.z[id] = key; syncState(byId.get(id)); }
// zawartosc wspolnego pliku: stan zachowania tylko tam, gdzie rozni sie od modelu
function mergedOceny() {
  const o = { stanZachowania: {}, stanTechniczny: {} };
  for (const e of els) {
    if (e.state !== e.modelState) o.stanZachowania[e.id] = e.state.key;
    const t = techOf(e); if (t) o.stanTechniczny[e.id] = t;
  }
  return o;
}

// warunek reguly: [min, max], null = "Brak oceny", pominiety = dowolna ocena
function matches(cond, v) {
  if (cond === undefined) return true;
  if (cond === null) return v === null;
  return v !== null && v >= cond[0] && v <= cond[1];
}
function ruleFor(e) {
  const z = e.state.grade, t = techOf(e) ? +techOf(e) : null;
  for (const r of RULES) if (matches(r.z, z) && matches(r.t, t)) return r;
  return { tekst: '—', priorytet: null };
}
// nazwy warstw w Rhino sa bez polskich znakow - tylko do wyswietlania
const PL = { sredni: 'średni', zly: 'zły', niezadowalajacy: 'niezadowalający', zadowalajacy: 'zadowalający',
  wypelnienia: 'wypełnienia', Sciany: 'Ściany', dzialowe: 'działowe' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plText = t => t.replace(/\p{L}+/gu, w => PL[w] || w);
const stateLabel = s => s.grade ? `${s.grade} – ${plText(s.label)}` : s.label;
// stan techniczny: te same kategorie 1-10 co stan zachowania (klucz = numer oceny jako tekst)
const TECH = STATE_CHOICES.filter(s => s.grade !== null).map(s => ({ key: String(s.grade), label: stateLabel(s), color: s.color }));
const TECH_LABEL = Object.fromEntries(TECH.map(t => [t.key, t.label]));
const TECH_COLOR = Object.fromEntries(TECH.map(t => [t.key, t.color]));

// ---------- geometria ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
const positions = new Float32Array(b64(D.geometry.positions));
const indices = new Uint32Array(b64(D.geometry.indices));
const matRGB = new Uint8Array(b64(D.geometry.colors));
const nV = positions.length / 3;

const stateCol = new Float32Array(nV * 3), matCol = new Float32Array(nV * 3);
const tmp = new THREE.Color();
for (const e of els) {
  for (let v = e.vStart; v < e.vStart + e.vCount; v++) {
    const c = new THREE.Color().setRGB(matRGB[v * 3] / 255, matRGB[v * 3 + 1] / 255, matRGB[v * 3 + 2] / 255, THREE.SRGBColorSpace);
    matCol.set([c.r, c.g, c.b], v * 3);
  }
}
const posAttr = new THREE.BufferAttribute(positions, 3);
const stateAttr = new THREE.BufferAttribute(stateCol, 3);
const matAttr = new THREE.BufferAttribute(matCol, 3);
// ustawia biezacy stan zachowania elementu i jego kolor w modelu
function syncState(e) {
  e.state = stateByKey[zKeyOf(e)];
  tmp.set(e.state.color); // Color.set('#hex') konwertuje juz sRGB -> liniowe
  for (let v = e.vStart; v < e.vStart + e.vCount; v++) stateCol.set([tmp.r, tmp.g, tmp.b], v * 3);
  stateAttr.needsUpdate = true;
}
els.forEach(syncState);
// kolory wg stanu technicznego (te same barwy co skala stanu zachowania; brak oceny = szary)
const techCol = new Float32Array(nV * 3);
const techAttr = new THREE.BufferAttribute(techCol, 3);
function syncTech(e) {
  tmp.set(TECH_COLOR[techOf(e)] || stateByKey['Brak oceny'].color);
  for (let v = e.vStart; v < e.vStart + e.vCount; v++) techCol.set([tmp.r, tmp.g, tmp.b], v * 3);
  techAttr.needsUpdate = true;
}
els.forEach(syncTech);

const baseGeo = new THREE.BufferGeometry();
baseGeo.setAttribute('position', posAttr);
baseGeo.setIndex(new THREE.BufferAttribute(indices, 1));
baseGeo.computeVertexNormals();
const normAttr = baseGeo.getAttribute('normal');
baseGeo.setAttribute('color', stateAttr);
baseGeo.computeBoundingBox(); baseGeo.computeBoundingSphere();

// bboxy elementow
for (const e of els) {
  const b = new THREE.Box3();
  const p = new THREE.Vector3();
  for (let v = e.vStart; v < e.vStart + e.vCount; v++) b.expandByPoint(p.fromArray(positions, v * 3));
  e.box = b;
}
// trojkat -> element
const triOwner = new Int32Array(indices.length / 3);
for (const e of els) triOwner.fill(e.idx, e.iStart / 3, (e.iStart + e.iCount) / 3);

// ---------- scena ----------
const viewer = document.getElementById('viewer');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewer.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9e6e0');
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12;

scene.add(new THREE.HemisphereLight(0xffffff, 0xb7ad9c, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-30, 60, 45); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(40, 20, -40); scene.add(fill);

const baseMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
const baseMesh = new THREE.Mesh(baseGeo, baseMat);
scene.add(baseMesh);

const bb = baseGeo.boundingBox, center = bb.getCenter(new THREE.Vector3()), size = bb.getSize(new THREE.Vector3());
const grid = new THREE.GridHelper(Math.ceil(Math.max(size.x, size.z) * 1.6), 40, 0xcfc8bb, 0xdcd6cc);
grid.position.set(center.x, bb.min.y - 0.02, center.z); scene.add(grid);

// warstwa podswietlenia (wspoldzieli bufory pozycji/normalnych)
const hlGeo = new THREE.BufferGeometry();
hlGeo.setAttribute('position', posAttr); hlGeo.setAttribute('normal', normAttr); hlGeo.setAttribute('color', stateAttr);
const hlMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, side: THREE.DoubleSide });
const hlMesh = new THREE.Mesh(hlGeo, hlMat); hlMesh.visible = false; hlMesh.renderOrder = 2; scene.add(hlMesh);
// kontur w kolorze spoza palety stanow
const edgeMat = new THREE.LineBasicMaterial({ color: 0x0a6cff, transparent: true, opacity: 0.5 });
let edges = null;

function resize() {
  const w = viewer.clientWidth, h = viewer.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewer); resize();

// widoki
function frame(box, dir, animate = true) {
  // dokladne dopasowanie naroznikow prostopadloscianu do kadru kamery perspektywicznej
  const c = box.getCenter(new THREE.Vector3());
  const back = dir.clone().normalize();
  const right = new THREE.Vector3().crossVectors(Math.abs(back.y) > 0.999 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0), back).normalize();
  const up = new THREE.Vector3().crossVectors(back, right);
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), tanH = tanV * camera.aspect;
  let dist = 0.5;
  for (let i = 0; i < 8; i++) {
    const p = new THREE.Vector3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).sub(c);

}

    `<h3>Elementy bez bloku – ID nadane automatycznie (${auto.length})</h3><p>Według nazwy obiektu (część przed „|”); gdy nazwa się powtarza – kolejny numer wg położenia wzdłuż elewacji.</p>${li(auto.map(e => esc(e.id) + (e.unnamed ? ' <i>(obiekt bez nazwy – nazwa wg elementu, w którym leży)</i>' : '')))}` +
    `<h3>Bloki z członkami na różnych warstwach stanu – podzielone na wiersze (${split.length})</h3>${li(split.map(e => `${esc(e.id)} – ${esc(stateLabel(e.modelState))} (${e.partCount} obiekt/y)`))}` +
    `<h3>Niezgodność oceny w nazwie obiektu z warstwą (${mism.length})</h3><p>Opis „(x/10)” w nazwie obiektu różni się od warstwy, na której obiekt leży. Jako wartość początkową tabela przyjmuje stan z <b>warstwy</b>.</p>${li(mism)}` +
    `<h3>Inne</h3>${li(['Blok „Stan - Impost”: jeden obiekt leży na warstwie „Ocena 10 - ruina / utrata”, ale ma kolor „z rodzica” (w Rhino wyświetla się jak 07). Przyjęto stan z warstwy (10) → wiersz <b>Impost.2</b>.',
      'Obiekty bez nazwy: ' + (unnamed.map(e => esc(e.id)).join(', ') || '—') + '.'])}`;
  document.getElementById('dlgNotes').showModal();
};

// ---------- start ----------
buildRows();
updateDirty();
document.getElementById('loading').remove();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
window.__app = { els, byId, setHover, pin, ruleFor, camera, controls, frame, VIEWS };
</script>
</body>
